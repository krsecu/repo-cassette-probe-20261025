name: race-cassette

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out public race builder
        uses: actions/checkout@v4
        with:
          repository: rougen1nj4/rc-fork-repo-cassette-solver
          path: builder
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: builder
      - name: Build race artifacts
        uses: ./builder/artifact-action
